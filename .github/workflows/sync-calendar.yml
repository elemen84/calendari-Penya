name: Sync Penya calendar

on:
  push:
    branches:
      - main
    paths:
      - "public/index.html"
      - "public/styles.css"
      - "public/app.js"
      - "public/favicon.svg"
      - "public/assets/**"
  schedule:
    # ~06:15 Europe/Madrid in summer. GitHub cron is UTC, can drift by hours,
    # and does not follow DST. Scheduled runs always force a sync so tip-off
    # changes are picked up once every calendar day even when cron jitter
    # would trip a rolling 24-hour gate.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the once-per-day gate"
        required: false
        default: false
        type: boolean

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python -m pip install -r requirements.txt

      - name: Generate public ICS
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          PENYA_SEASON_START_YEAR: ${{ vars.PENYA_SEASON_START_YEAR }}
          ACB_API_KEY: ${{ vars.ACB_API_KEY }}
          BCL_APIM_SUBSCRIPTION_KEY: ${{ vars.BCL_APIM_SUBSCRIPTION_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force }}" = "true" ]; then
            python scripts/sync_calendar.py --force
          else
            python scripts/sync_calendar.py
          fi

      - name: Commit changed state, snapshots and ICS
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sync-state.json data/standings public/penya.ics
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "chore: sync Penya calendar data"
            git push
          fi

      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# workflow registration refresh
